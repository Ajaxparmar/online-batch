<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <script src="data.js"></script>

    <title>Hello, world!</title>
</head>

<body>
    <div class="container mt-5">
        <div class="row" id="webcourses">
        </div>
    </div>

    <script>

        const mydiv = document.getElementById("webcourses")

        // for (let i of itCourses) {
        //     console.log(mydiv);
        // }

        itCourses.forEach((value, index) => {
            mydiv.innerHTML += `<div class="col-lg-4 mb-5">
                < div class="card" >
                    <img src="${value.image}" class="card-img-top" alt="...">
                        <div class="card-body">
                            <h3 class="card-title"> CourseName: ${value.courseName}</h3>
                            <h3 class="card-title">Trainer Name: ${value.trainer}</h3>
                              <h3 <span>duration: ${value.duration}</span>  </h3>
                            <a href="DETAILS.html?id=${index}" class="btn btn-primary">Go somewhere</a>
                        </div>
                    </div>
            </div>`
        })



    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</body>
