<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 2px solid green;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .header {
            grid-column-start: 1;
            grid-column-end: 4;
            height: 70px;
            background-color: #ff4500 !important;
        }

        .sidebar {
            grid-row-start: 2;
            grid-row-end: 4;
            background-color: #e5ff00 !important;
        }

        .content {
            height: 200px;
            grid-column-start: 2;
            grid-column-end: 4;
            background-color: #0004ff !important;
            grid-row-start: 2;
        }

        .content-1 {
            height: 100px;
            grid-column-start: 2;
            grid-column-end: 3;
            
        }

        .content-2 {
            height: 100px;
            grid-column-start: 3;
            grid-column-end: 4;
        }

        .footer {
            grid-column-start: 1;
            grid-column-end: 4;
            grid-row-start: 4;

        }

        .card {
            background-color: aquamarine;
            padding: 8px 10px;
            margin: 20px;
            color: white;
            text-align: center;
            font-size: 25px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card header">
            header
        </div>
        <div class="card sidebar">
            sidebar
        </div>
        <div class="card content">
            content
        </div>
        <div class="card content-1">
            content 1
        </div>
        <div class="card content-2">
            content 2
        </div>
        <div class="card footer">
            footer
        </div>
    </div>

</body>

</html>
