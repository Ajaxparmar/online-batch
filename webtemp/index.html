<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="//fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
    
        .container{
            width: 80%;
            margin: 0px auto;
            line-height: 60px;
        }
        .d-flex{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .text-red{
            font-weight: 400;
            color: red;
        }
        .brand-logo h2{
            font-size: 32px;
        }
        .nav-items  nav ul li{
            padding: 8px 12px;
            list-style: none;
        }
        .nav-items nav ul li a{
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            color: black;

        }
        .nav-items form input{
            font-size: 16px;
            padding: 6px 12px;
            border:1px solid gainsboro;
            border-radius: 50px 0px 0px 50px;
        }
        .nav-items form  button{
            background-color: red;
            border: 0;
            padding: 6px 12px;
            font-size: 16px;
            color: white;
            border-radius: 0px 50px 50px 0px;
        }
        .nav-items form{
            display: flex;
        }
        .nav-items .fa-moon{
            font-size: 24px;
        }
        .main-content{
            width: 100%;
            height: 90vh;
            background-image: url('https://p.w3layouts.com/demos_new/template_demo/02-02-2022/workup-liberty-demo_Free/60229367/web/assets/images/banner1.jpg');
        }
        .card{
            background-color: white;
            width: 600px;
            padding: 10px 20px;
            position:absolute;
            bottom: 200px;
            border-radius:10px;
        }
        .card h1{
            font-size: 48px;
        }
        .card h6{
            font-size: 16px;
        }
        .bg-overlay{
            width: 100%;
            height: 90vh;
            background-color: rgba(0, 0, 0, 0.36);
            position: absolute;
        }
        .btn{
            padding: 8px 16px;
            border: none;
            font-size: 16px;
            color:white;
            font-weight: 600;
            margin: 20px 0px;
        }
        .btn-danger{
            background-color: red;
            border-radius: 20px;
        }
    </style>

</head>
<body>
    <section class="header">
        <div class="container d-flex">
            <div class="brand-logo">
                <h2><span class="text-red"><i class="fab fa-wikipedia-w"></i></span>orkup</h2>
            </div>
            <div class="nav-items d-flex">
                <nav>
                    <ul class="d-flex">
                        <li><a href="#">Home</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Services</a></li>
                        <li><a href="#">Blog</a></li>
                        <li><a href="#">pages</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </nav>
                <form>
                    <input type="search" placeholder="Enter keyword...">
                    <button><i class="fas fa-search"></i></button>
                </form>
                <i class="fa-regular fa-moon"></i>
            </div>
        </div>
    </section>
    
    <section class="main-content">
        <div class="bg-overlay"></div>
        <div class="container">
            <div class="card">
                <h6>Business & Finance Consultancy</h6>
                <h1>Plan Business to Active Goal!</h1>
                <button class="btn btn-danger">Read More</button>
            </div>
        </div>
    </section>

</body>
</html>
