<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
</head>

<style>
    .header {
        background-color: green;
        padding: 15px;
        text-align: center;
    }

    .header h1 {
        color: white;
        margin: 0;
    }

    .nav_menu {
        overflow: hidden;
        background-color: #333;
    }

    .nav_menu a {
        float: left;
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
    }

    .nav_menu a:hover {
        background-color: white;
        color: green;
    }
       .flex-container {
            display: flex;
            background-color: #f2f2f2;
            padding: 20px;
        
        }
        .flex-item {
            background-color: #4CAF50;
            color: white;
            margin: 1px;
            padding: 20px;
            text-align: center;
            flex: 1;
        }


    
    .footer {
        background-color: rgba(19, 149, 197, 0.678);
        padding: 15px;
        text-align: center;
    }
    .footer h2{
        color: white;
    }
    

</style>

<body>

    <div class="header">
        
            <h1>header</h1>
        
    </div>
    <div class="nav_menu">
        <a href="#">logo</a>
        <a href="#">ds</a>
        <a href="#">lang</a>
    </div>

    </div>

    <div class="flex-container">
        <div class="flex-item">content of column A</div>
        <div class="flex-item">content of column B</div>
        <div class="flex-item"> content of column C</div>
        
    </div>
    <div class="footer">
            <h2>Footer</h2>
        </div>
</body>

</html>
