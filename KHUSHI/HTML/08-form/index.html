<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    
    <form action="" method="post" backgroundcolor="pink">
        <label for="Firstname">First name</label>
        <input type="text" name="firstname" id="Firstname" placeholder="Enter your name" required autofocus>
        <br><br>

        <label for="Lastname">Last name</label>
        <input type="text" name="lastname" id="Lastname" placeholder="Enter your lastname">
        <br><br>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" required>
        <br><br>

        <label for="dob">DOB</label>
        <input type="date" name="dob" id="dob" required>
        <br><br>

        <label for="gender">Gender</label>
        <input type="radio" name="gender" value="male" id="male">
        <label for="male">Male</label>
        <br>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">Female</label>
        <br><br>

        <label for="subject">Select Subject</label>
        <input type="checkbox" name="subject1" id="html" required>
        <label for="html">HTML</label>
        <input type="checkbox" name="subject2" id="js">
        <label for="js">JS</label>
        <input type="checkbox" name="subject3" id="java">
        <label for="java">JAVA</label>
        <br><br>

        <label for="city">Select City</label>
        <select name="mycity" id="">
            <optgroup label="Haryana">
                <option value="">hansi</option>
                <option value="">hisar</option>
                <option value="">rohtak</option>
                <option value="">jind</option>
                <option value="">sirsa</option>
            </optgroup>
            <optgroup label="punjab">
                <option value="">chandigarh</option>
                <option value="">ludhiyana</option>
                <option value="">hhhh</option>
                <option value="">jaslmare</option>
                <option value="">amritsar</option>
            </optgroup>
            <optgroup label="delhi">
                <option value="">ncr</option>
                <option value="">noida</option>
                <option value="">nipur</option>
                <option value="">hdsh</option>
                <option value="">hisd</option>
                <option value="">ni</option>
            </optgroup>
        </select>
        <br><br>


        <label for="image">Upload Image</label>
        <input type="file" name="myfile" id="image" multiple accept .jpg, .png>
        <br><br>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" value="password" required>
        <br><br>

        <label for=""></label>
        <input type="text" name="10002" value="1002" id="" disabled>
        <br><br>

        <label for="range">Select Range</label>
        <input type="range" name="range" id="" min="10" max="100" value="30">
        <br><br>

        <label for="address:-">Address</label>
        <textarea name="" id="address:-" rows="2" cols="5"></textarea>
        <br><br>

        <input type="submit" value="save form" name="" id="">
        <br><br>

        <button>Save</button>
        <br><br>

        <input type="reset">


    </form>
</body>

</html>
