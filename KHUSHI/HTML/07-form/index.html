<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">

        <label for="firstname">First name</label>
        <input type="text" name="" id="first name" placeholder="Enter your name" required autofocus>
        <br><br>

        <label for="lastname ">Last name</label>
        <input type="text" name="" id="lastname" placeholder="Enter you last name">
        <br><br>

        <label for="email">Email ID</label>
        <input type="email" value="email" name="Email" id="email">
        <br><br>

        <label for="Gender">Gender</label>
        <input type="radio" name="Gender" id="male">
        <label for="male">Male</label>
    

        <input type="radio" name="Gender" id="female">
        <label for="female">Female</label>
        <br><br>

        <label for="password">Password</label>
        <input type="password" name="password" id="password">
        <br><br>

        <label for="subject">Select Subject</label>
        <input type="checkbox" name="subject1" id="html" checked required>
        <label for="html">Html</label>
        <br>

        <input type="checkbox" name="subject2" id="JS">
        <label for="JS">JS</label>

        <input type="checkbox" name="subject3" id="JAVA">
        <label for="JAVA">JAVA</label>
        <br><br>

        <input type="button" name="submit" id="save">
        <label for="save">submit</label>

        <button>Save</button>
    </form>
</body>
</html>
