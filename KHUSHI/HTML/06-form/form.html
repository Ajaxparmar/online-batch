<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <label for="Fname">First name</label>
        <input type="text" name="Firstname" id="Fname" placeholder="Enter your name" required autofocus>
        <br><br>

        <label for="Lname">Last name</label>
        <input type="text" name="Lastname" id="Lname" placeholder="Enter your last name ">
        <br><br>

        <label for="email">Email</label>
        <input type="email" name="Email" id="email" placeholder="abc@eiu..." required>
        <br><br>

        <label for="dob">DOB</label>
        <input type="date" name="Dateofbirth" id="dob" required>
        <br><br>

        <label for="Gender">Select Gender</label>
        <input type="radio" name="Gender" id="male" value="Male">
        <label for="male">Male</label>
        <input type="radio" name="Gender" id="female" value="Female">
        <label for="female">female</label>
        <br><br>

        <label for="subject">Select Subject</label>
        <input type="checkbox" name="subject1" id="html" value="html" required>
        <label for="html">HTML</label>
        <br><br>
        <input type="checkbox" name="subject2" id="js" value="js">
        <label for="js">JS</label>
        <br><br>

        <input type="checkbox" name="subject3" id="java" value="java">
        <label for="java">JAVA</label>
        <BR><BR>

        <label for="city"> Select city</label>
        <select name="city" >
         <optgroup label="Haryana">
            <option>hisar</option>
            <option>jind</option>
            <option>hansi</option>
            <option>hiaaa</option>
            <option>rohtak</option>
        </optgroup>
        <optgroup label="Chandigarh">
            <option value="">hjhjh</option>
            <option value="">bshd</option>
            <option value="">jhsdj</option>
        </optgroup>   
        </select><br><br>

        <label for="uploadimage">Upload image</label>
        <input type="file" name="myfile" id="uploadimage" accept=".jpg, .png" multiple>
        <br><br>

        <label for="password">Password</label>
        <input type="password" name="password" id="password">
        <br><br>

        <input type="text" readonly
        value="00002" name="srno">


        <button>SAVE</button>


    </form>
</body>

</html>
