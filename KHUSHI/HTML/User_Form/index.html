<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action=""></form>
    <fieldset>
        <legend>User Personal Information</legend>

        <label for="name">Enter your full name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Enter your email</label>
        <input type="text" id="email" name="email" required>
        <br><br>

        <label for="password">Enter your Password</label>
        <input type="password" name="pass" id="password" required>
        <br><br>

        <label for="confirmpasswor">Confirm your password</label>
        <input type="password" id="confirmpasssword" name="confirmpass" required>
        <br><br>

        <label for="">Enter your gender:</label>
        <div class="gender - group"> 

        <label for="male">Male</label>   
        <input type="radio" name="gender" value="male" id="male" required>

        <label for="female">Female</label>
        <input type="radio" name="gender" value="female" id="female">

        <label for="others">others</label>
        <input type="radio" name="gender" value="thers" id="others">
        <br><br>

        <div>
            <label for="dob">Enter your Date of Birth</label>
            <input type="date" name="dob" id="dob" required>
            <br><br>

            <label for="address">Enter your Address:</label>
            <br>
            <textarea name="address" id="address" required></textarea>
            <br><br>

            <input type="submit" value="Submit">
        

    </fieldset>
</body>
</html>
