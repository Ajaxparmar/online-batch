<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <title>Document</title>
    <script>
        const doctors = [
            {
                id: 1,
                name: "Dr. John Smith",
                specialization: "Cardiologist",
                hospital: "City Care Hospital",
                experience: "12 Years",
                image: "https://randomuser.me/api/portraits/men/1.jpg"
            },
            {
                id: 2,
                name: "Dr. Emily Johnson",
                specialization: "Dermatologist",
                hospital: "Sunrise Hospital",
                experience: "8 Years",
                image: "https://randomuser.me/api/portraits/women/2.jpg"
            },
            {
                id: 3,
                name: "Dr. Michael Brown",
                specialization: "Neurologist",
                hospital: "Apollo Medical Center",
                experience: "15 Years",
                image: "https://randomuser.me/api/portraits/men/3.jpg"
            },
            {
                id: 4,
                name: "Dr. Sophia Williams",
                specialization: "Pediatrician",
                hospital: "Green Valley Hospital",
                experience: "10 Years",
                image: "https://randomuser.me/api/portraits/women/4.jpg"
            },
            {
                id: 5,
                name: "Dr. David Wilson",
                specialization: "Orthopedic Surgeon",
                hospital: "Metro Hospital",
                experience: "18 Years",
                image: "https://randomuser.me/api/portraits/men/5.jpg"
            }
        ];

        console.log(doctors);
    </script>
</head>

<body>
    <div class="container mt-5 ">
        <div class="card p-4">
            <h2>Doctors Details</h2>
            <div class="card mb-3 p-4">
                <div class="row g-0">
                    <div class="col-md-4">
                        <img src="..." class="img-fluid rounded-start" alt="..." id="doctorimg">
                    </div>
                    <div class="col-md-8">
                        <div class="card-body">
                            <h5 class="card-title" id="doctorname">Card title</h5>
                            <p class="card-text">hospital <span id="hospital"></span></p>
                            <p class="card-text">experience<span id="experience"></span></p>
                            <p class="card-text"><small class="text-muted">Last updated 3 mins ago</small></p>
                        </div>
                        <div class="d-flex justify-content-around ">
                            <button class="btn btn-danger" onclick="previous()">Previous</button>
                            <button class="btn btn-success" onclick="next()">Next</button>

                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script>
        const img = document.getElementById("doctorimg")
        const doctorname = document.getElementById("doctorname")
        const hospital = document.getElementById("hospital")
        const experience = document.getElementById("experience")

        img.src = doctors[0].image
        doctorname.innerHTML = doctors[0].name
        hospital.innerHTML = doctors[0].hospital
        experience.innerHTML = doctors[0].experience

        let count = 0
        function next() {
            count++;
            if (count < doctors.length) {
                img.src = doctors[count].image
                doctorname.innerHTML = doctors[count].name
                hospital.innerHTML = doctors[count].hospital
                experience.innerHTML = doctors[count].experience
            }
            else {
                alert("No doctors")
                count = 4
            }
        }
            function previous() {
                count--;
                if (count > 0) {
                    img.src = doctors[0].image
                    doctorname.innerHTML = doctors[count].name
                    hospital.innerHTML = doctors[count].hospital
                    experience.innerHTML = doctors[count].experience
                }
                else {
                    alert("No doctors")
                    count = 0

                }
            }
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
