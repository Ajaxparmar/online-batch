<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .body {
        margin: 20px;
        padding: 70px;
    }


    .container {
        display: grid;
        grid-template-columns: 200px 2fr 2fr;
        grid-template-rows: 100px 150px 150px 100px;
        gap: 15px;
        padding: 30px;
        border: 1px solid;
    }

    .header {
        background-color: aqua;
        grid-column-start: 1;
        grid-column-end: 4;
        height: 70px;
        border: 1px solid ;

    }

    .sidebar {
        grid-row-start: 2;
        grid-row-end: 4;
        background-color: rgba(255, 255, 0, 0.371);
        border: 1px solid;

    }

    .main-content {
        grid-column-start: 2;
        grid-column-end: 4;
        grid-row-start: 2;
        grid-row-end: 3;
        background-color: rgb(230, 14, 241);
        border: 1px solid;
    }

    .content-1 {
        grid-row-start: 3;
        grid-row-end: 4;
        grid-column-start: 2;
        grid-column-end: 3;
        background-color: rgb(235, 72, 7);
        border: 1px solid;
       
    }

    .content-2 {
        grid-row-start: 3;
        grid-row-end: 4;
        grid-column-start: 3;
        grid-column-end: 4;
        border: 1px solid;
        background-color: rgb(157, 255, 0);
    }

    .footer {
        grid-row-start: 4;
        grid-row-end: 5;
        grid-column-start: 1;
        grid-column-end: 4;
        border: 1px solid;
        background-color: rgb(164, 13, 202);
    }

      .hi {
            padding:10px;
            margin: 10px;
            align-items: center;
            font-size: 20px;
        }
</style>

<body>
    <div class="container">
        <div class="hi header">
            Header
        </div>
        <div class="hi sidebar">
            sidebar
        </div>
        <div class="hi main-content">
            main-content
        </div>
        <div class="hi content-1">
            content-1
        </div>
        <div class="hi content-2">
            content-2
        </div>
        <div class="hi footer">
            footer
        </div>
    </div>
</body>

</html>
