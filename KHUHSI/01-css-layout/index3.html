<!DOCTYPE html>
<html>
<head>
    <title>Grid + Flex</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    padding:20px;
}

.container{

    display:grid;

    grid-template-columns:200px 1fr 1fr;

    grid-template-rows:100px 150px 150px 100px;

    gap:15px;

}

header{
    grid-column-start: 1;
    grid-column-end: 4;
}

aside{
    grid-row:2/4;
}

.content1{
    grid-column:2/4;
}

footer{
    grid-column:1/4;
}

header,
aside,
.content1,
.content2,
.content3,
footer{

    background:lime;
    border:2px solid gray;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:24px;

}
</style>
<body>

<div class="container">

    <header>Header</header>

    <aside>Side Bar</aside>

    <div class="content1">
        Content 1
    </div>

    <div class="content2">
        Content 2
    </div>

    <div class="content3">
        Content 3
    </div>

    <footer>Footer</footer>

</div>

</body>
</html>
